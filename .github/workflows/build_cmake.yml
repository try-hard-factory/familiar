name: Building(CMake)

on:
  # PR into develop - the actual gate: feature branches don't get their
  # own run until a PR against develop exists (was `branches: '*'` on
  # both triggers - fired on every bare push to any branch too, often
  # twice over for the same commit once a PR opened. paths-ignore below
  # still applies per-event).
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  # develop: re-validates the exact merge commit after a PR lands (a PR
  # branch's own head commit isn't necessarily identical to what
  # actually ends up on develop, e.g. a squash merge). main: Max's own
  # stated flow pushes straight to main once develop is stable - this
  # is that build. Tag pushes (releases) are NOT branch pushes, so this
  # never re-triggers them - that's what each *-pack.yml's own
  # `run-tests` job is for, including hotfix/* tags this never sees.
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  QT_VERSION: '6.11.1'

jobs:
  linux-build:
    name: ${{ matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]

    steps:
      - name: Checkout Source code
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Checkout Source code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true

      - name: Checkout Source code
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: true

      - name: Install Dependencies
        run: |
          sudo apt-get -y -qq update
          sudo apt-get -y --no-install-recommends install \
            cmake \
            extra-cmake-modules \
            build-essential \
            xvfb

      - name: Cache Qt
        id: cache-qt-linux
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/Qt
          key: ${{ runner.os }}-QtCache-${{ env.QT_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          dir: '${{ github.workspace }}/build/'
          cache: ${{ steps.cache-qt-linux.outputs.cache-hit == 'true' }}

      - name: Create Build Environment
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{runner.workspace}}/build
        # Note the current convention is to use the -S and -B options here to specify source
        # and build directories. We need to source the profile file to make sure conan is in PATH
        run: |
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: cmake --build . --parallel 2 --config $BUILD_TYPE

      - name: Test
        working-directory: ${{runner.workspace}}/build
        shell: bash
        # familiar -t (the actual GoogleTest suite, run via add_test() in
        # src/CMakeLists.txt) still constructs a real QApplication - Qt
        # Widgets, not headless. Without a display this fails to init and
        # ctest reports "Subprocess aborted" in ~0.1s (confirmed: that's
        # exactly what a bare `ctest -C $BUILD_TYPE` here does - nothing
        # ever ran, not "0 tests passed"). QT_QPA_PLATFORM=offscreen was
        # tried for individual widget tests earlier in this project and
        # confirmed to fail HARDER than a real (virtual) display for
        # synthetic QTest::mouseClick/keyClick button press/release
        # tracking (see tests/widgets/flat_checkbox_test.cpp's own
        # comment) - xvfb-run gives a real, if virtual, X11 server
        # instead, which is what those tests actually need.
        run: xvfb-run -a ctest -C $BUILD_TYPE --output-on-failure

  windows-build:
    name: Windows
    runs-on: windows-2022
    env:
      # A one-item strategy.matrix used to sit here just to carry this
      # value (plus name/artifact/cc/cxx/environment_script, all
      # unused anywhere in this job - dead, presumably copy-pasted from
      # a template). GitHub Actions always appends every matrix field
      # to the job's displayed/check-run name in parens, with no way
      # to suppress it via a custom `name:` (confirmed - a known,
      # documented-nowhere-official limitation) - a real problem for a
      # branch-protection required-check name, since it made this job
      # show up as a 100-char auto-truncated string. Plain runs-on +
      # env instead, since there was only ever one combination anyway.
      WINDOWS_QT_VERSION: '6.10.3'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Fix Python path
        shell: pwsh
        run: |
          Remove-Item "$env:LOCALAPPDATA\Microsoft\WindowsApps\python*.exe" -Force -ErrorAction SilentlyContinue

      - name: Cache Qt
        id: cache-qt-windows
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/Qt
          key: ${{ runner.os }}-QtCache-${{ env.QT_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.WINDOWS_QT_VERSION }}
          cache: 'true'
          cache-key-prefix: install-qt-action-${{ env.WINDOWS_QT_VERSION }}
          target:  desktop
          dir: '${{ github.workspace }}/build/'

      - name: Configure
        working-directory: build
        shell: powershell
        run: |
          cmake .. -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE:STRING=$env:BUILD_TYPE -DENABLE_OPENSSL=ON -DRUN_IN_PLACE=OFF
          ls

      - name: Build
        working-directory: build
        shell: powershell
        run: |
          cmake --build . --parallel 2 --config $env:BUILD_TYPE

      - name: Test
        # Was missing entirely - this job built familiar.exe but never
        # ran the embedded GoogleTest suite (`-t`), unlike linux-build
        # right above it. CMAKE_RUNTIME_OUTPUT_DIRECTORY (top-level
        # CMakeLists.txt) pins the Visual Studio multi-config generator's
        # output to build/<Config>/, not build/src/<Config>/ - confirmed
        # the hard way already in Windows-pack.yml's own run-tests job,
        # same path here.
        working-directory: build
        shell: powershell
        # A bare `.\$env:BUILD_TYPE\familiar.exe` as the command name
        # itself doesn't get $env: expanded by PowerShell (real CI
        # failure this fixes - "term ... is not recognized", literally
        # unexpanded) - PowerShell only expands variables like that
        # inside a quoted string or via the call operator, not in a
        # bareword command-name token. & plus a quoted path fixes it.
        run: '& ".\$env:BUILD_TYPE\familiar.exe" -t'

  # Was missing entirely from this file - macOS build+test only existed
  # gated behind a tag push (MacOS-pack.yml's own run-tests job), so a
  # PR/push to develop or main never actually validated macOS at all.
  # Steps mirror that job (same brew/cmake/Qt6_DIR pattern) - not a
  # packaging run, no .dmg, just build+test like linux-build/windows-build.
  macos-build:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Qt6
        run: brew install qt@6

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DQt6_DIR="$(brew --prefix qt@6)/lib/cmake/Qt6"

      - name: Compile
        run: cmake --build build --parallel "$(sysctl -n hw.ncpu)"

      - name: Test
        working-directory: build
        # Same defensive `find` as MacOS-pack.yml's run-tests - the .app
        # bundle's exact path under build/ isn't worth hardcoding a
        # second guess for (see that job's own comment on why).
        run: |
          BINARY=$(find . -path "*.app/Contents/MacOS/familiar" | head -1)
          "$BINARY" -t