name: Notify site

# Create Release publishes with GITHUB_TOKEN. GitHub does not start another
# workflow from that token's release event, so the tag push is the normal
# trigger; release: published also covers releases created manually.
on:
  push:
    tags:
      - 'v[0-9].[0-9]+.[0-9]+'

  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose state the site should be rebuilt from
        required: true

permissions:
  actions: read
  contents: read

jobs:
  rebuild-site:
    name: Rebuild the website
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SITE_REPO: try-hard-factory/familiar-web
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Check site dispatch token
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::error::Secret SITE_DISPATCH_TOKEN is not set in this repository."
            exit 1
          fi

      - name: Wait for packaging to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          echo "Release $TAG is commit $sha"
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"

          # Both beta packaging workflows must appear for this tag before
          # either can be considered done. head_sha alone can also match a
          # different tag on the same commit; head_branch identifies this one.
          # event=push keeps nightly runs on the same commit out of the list.
          deadline=$((SECONDS + 100 * 60))
          grace=$((SECONDS + 3 * 60))
          while :; do
            runs="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=push&per_page=100" \
              | jq -r --arg tag "$TAG" '
                  .workflow_runs[]
                  | select(.head_branch == $tag)
                  | select(.name == "Packaging(Windows)" or .name == "Packaging(Linux)")
                  | [.name, .status, (.conclusion // "-")]
                  | @tsv')"

            printf '%s\n' "$runs" | awk -F'\t' 'NF { printf "  %-20s %-12s %s\n", $1, $2, $3 }'

            windows="$(printf '%s\n' "$runs" | awk -F'\t' '$1 == "Packaging(Windows)"' | wc -l)"
            linux="$(printf '%s\n' "$runs" | awk -F'\t' '$1 == "Packaging(Linux)"' | wc -l)"
            pending="$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed"' | wc -l)"

            # Create Release runs in parallel with packaging. A fast or
            # failed packaging run must not dispatch a build of the old
            # release list before the new release itself is visible.
            published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.published_at // empty' 2>/dev/null || true)"
            if [ "$windows" -gt 0 ] && [ "$linux" -gt 0 ] \
               && [ "$pending" -eq 0 ] && [ -n "$published" ]; then
              break
            fi
            # A manually published release or manual re-run may have no
            # packaging workflows. Keep that path usable after allowing
            # time for the run records to appear. Tag pushes stay strict.
            if [ "$EVENT_NAME" != "push" ] && [ "$windows" -eq 0 ] \
               && [ "$linux" -eq 0 ] && [ -n "$published" ] \
               && [ "$SECONDS" -ge "$grace" ]; then
              echo "No packaging runs for $TAG; rebuilding the published release as-is."
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the published release and both packaging workflows for $TAG (Windows: $windows, Linux: $linux, pending: $pending). Re-run this workflow once they finish."
              exit 1
            fi
            echo "Waiting for published release and Windows/Linux packaging for $TAG."
            sleep 60
          done

          failed="$(printf '%s\n' "$runs" | awk -F'\t' 'NF && $3 != "success"' | wc -l)"
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed packaging run(s) for $TAG did not succeed. Rebuilding the site anyway; it will show whichever downloads exist."
          fi

      - name: Ask familiar-web to rebuild and publish its images
        env:
          # Cross-repository: needs Contents: write on $SITE_REPO.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Secret SITE_DISPATCH_TOKEN is not set in this repository."
            exit 1
          fi

          jq -n --arg tag "$TAG" --arg commit "$RELEASE_SHA" \
            '{event_type: "familiar-release",
              client_payload: {tag: $tag, commit: $commit}}' \
            | gh api -X POST "repos/$SITE_REPO/dispatches" --input -

          echo "Dispatched familiar-release for $TAG."
